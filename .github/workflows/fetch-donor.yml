name: Fetch Granny Legacy donor

on:
  push:
    paths:
      - '.github/workflows/fetch-donor.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Granny Legacy v1.8.9 donor
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            'https://github.com/takivn0/GrannyLegacyOffline/releases/download/1.8.9/Granny.Legacy.Offline.v1.8.9.zip' \
            -o donor.zip
          echo '43f1709704c93291fa96103ffaaef12ae0e8d4e50f4d3aff20c8b643f854012c  donor.zip' | sha256sum -c -
          mkdir donor_parts
          split -b 90M -d -a 2 donor.zip donor_parts/donor.part.
          ls -lh donor_parts
      - name: Upload chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: donor-part-00
          path: donor_parts/donor.part.00
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: donor-part-01
          path: donor_parts/donor.part.01
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: donor-part-02
          path: donor_parts/donor.part.02
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 03
        uses: actions/upload-artifact@v4
        with:
          name: donor-part-03
          path: donor_parts/donor.part.03
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 04
        uses: actions/upload-artifact@v4
        with:
          name: donor-part-04
          path: donor_parts/donor.part.04
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 05
        uses: actions/upload-artifact@v4
        with:
          name: donor-part-05
          path: donor_parts/donor.part.05
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 06
        uses: actions/upload-artifact@v4
        with:
          name: donor-part-06
          path: donor_parts/donor.part.06
          compression-level: 0
          retention-days: 1
      - name: Upload chunk 07
        uses: actions/upload-artifact@v4
        with:
          name: donor-part-07
          path: donor_parts/donor.part.07
          compression-level: 0
          retention-days: 1

# transport-only workflow; remove after donor acquisition
